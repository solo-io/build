name: pull_request

on:
  push:
    branches:
    - 'master'
  pull_request: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-18.04
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@ee9e0f86fb1a4d7029390154477333bf53e41c5e # 0.4.0
      with:
        access_token: ${{ github.token }}
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      with:
        fetch-depth: 0
    - name: Set up Go 1.14
      uses: actions/setup-go@0caeaed6fd66a828038c2da3c0f662a42862658f # v1.1.3
      with:
        go-version: 1.14
    - uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1.2.1
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go
    - uses: azure/setup-kubectl@a625ca209b0faaa8871dac8fb5f50ee4b4d22622 # v1
      with:
        version: 'v1.18.0'
    - uses: engineerd/setup-kind@d0e9be1a527c343e9f48768138359d8253e526c0 # v0.3.0
    - name: Build
      run: |
          go build ./...
    - name: Run tests
      run: |
        go get -v github.com/onsi/ginkgo/ginkgo@v1.12.0 && export PATH=$PATH:$(go env GOPATH)/bin/
        ginkgo  -r   -p   -failFast   -randomizeSuites   -randomizeAllSpecs
